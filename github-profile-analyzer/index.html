<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GitHub Profile Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>GitHub Profile Analyzer</h1>
        <p class="sub">Explore any public GitHub profile, repositories and languages.</p>
        <form id="form"><input id="username" placeholder="Enter GitHub username" required><button>Analyze</button>
        </form>
        <p id="msg"></p>
        <section id="app" class="hidden">
            <div class="profile"><img id="avatar">
                <div>
                    <h2 id="name"></h2>
                    <p id="login"></p>
                    <p id="bio"></p><a id="link" target="_blank">View GitHub Profile ↗</a>
                </div>
            </div>
            <div class="stats">
                <div><b id="repos">0</b><span>Repositories</span></div>
                <div><b id="followers">0</b><span>Followers</span></div>
                <div><b id="following">0</b><span>Following</span></div>
                <div><b id="stars">0</b><span>Total Stars</span></div>
            </div>
            <div class="grid">
                <article>
                    <h3>Profile</h3>
                    <p><b>Location:</b> <span id="location">-</span></p>
                    <p><b>Company:</b> <span id="company">-</span></p>
                    <p><b>Joined:</b> <span id="joined">-</span></p>
                </article>
                <article>
                    <h3>Top Languages</h3>
                    <div id="languages"></div>
                </article>
            </div>
            <article>
                <h3>Popular Repositories</h3>
                <div id="repoList" class="repos"></div>
            </article>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
